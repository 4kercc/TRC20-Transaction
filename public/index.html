<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>TRC20 交易查询</title>
</head>
<body>
  <h2>TRC20 地址交易查询</h2>
  <form id="query-form">
    地址: <input type="text" name="address" value="TY54YmrK4HEoNUpKEFM479mfSf4pNZs7ue"><br><br>
    开始时间: <input type="datetime-local" name="start_time"><br><br>
    结束时间: <input type="datetime-local" name="end_time"><br><br>
    合约地址（可选）: <input type="text" name="token_contract"><br><br>
    <button type="submit">查询</button>
  </form>

  <pre id="result"></pre>

  <script>
    document.getElementById('query-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = new FormData(e.target);
      const data = Object.fromEntries(form.entries());
      const res = await fetch('/api', {
        method: 'POST',
        body: JSON.stringify(data)
      });
      const result = await res.json();
      document.getElementById('result').textContent = JSON.stringify(result, null, 2);
    });
  </script>
</body>
</html>
